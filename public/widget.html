<body>
    <div class="widget-container">
        <!-- Header -->
        <header class="widget-header">
            <a href="https://cec.org.co" target="_blank" class="widget-banner">

                </div>

        </header>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Featured News with Video Carousel -->
            <div class="featured-section" id="featuredNews">
                <div class="loading">Cargando...</div>
            </div>

            <!-- News List -->
            <div class="news-list-section">
                <div class="news-list" id="newsList">
                    <div class="loading">Cargando noticias...</div>
                </div>
            </div>
        </div>

                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
                Ver más en cec.org.co
            </a>
        </footer>

    <script>
        function escapeHtml(text) {
            if (!text) return '';
            // Primero decodificar entidades HTML existentes
            const div = document.createElement('div');
            div.innerHTML = text;
            const decoded = div.textContent;
            // Luego codificar correctamente para HTML
            div.textContent = decoded;
            return div.innerHTML.replace(/'/g, '&#39;');
        }

        async function loadNews() {
            try {
                // Intentar API del worker primero
                const response = await fetch('https://cec-scraper.moltbotmichael1.workers.dev');
                const apiNews = await response.json();
                
                // Cargar archivo local para obtener más videos
                const localResponse = await fetch('news-data.json');
                const localNews = await localResponse.json();
                
                // Combinar: usar videos del archivo local (tiene más)
                const localVideos = localNews.filter(n => n.video && n.video.includes('youtube.com/embed/'));
                const apiVideos = apiNews.filter(n => n.video && n.video.includes('youtube.com/embed/'));
                
                // Si tenemos más videos locales, usarlos
                const allNews = localVideos.length > apiVideos.length ? localNews : apiNews;
                
                renderNews(allNews);
            } catch (error) {
                console.error('Error loading news:', error);
                // Fallback: archivo local
                try {
                    const fallbackResponse = await fetch('news-data.json');
                    const news = await fallbackResponse.json();
                    renderNews(news);
                } catch (fallbackError) {
                    document.getElementById('featuredNews').innerHTML = `
                        <div class="featured-content">
                            <p style="color:#718096;font-size:13px;">Error al cargar. <a href="https://cec.org.co" target="_blank">Visitar CEC.org.co</a></p>
                        </div>
                    `;
                }
            }
        }

        function renderNews(news) {
            if (!news || news.length === 0) return;

            // Get ALL videos (even older ones) - always show last 3 videos in carousel
            const videoItems = news.filter(item => item.video && item.video.includes('youtube.com/embed/'));
            const featuredItems = videoItems.slice(0, 3);
            
            // Remaining items for text list (exclude videos from list)
            const featuredUrls = featuredItems.map(f => f.url);
            const remaining = news.filter(item => !featuredUrls.includes(item.url)).slice(0, 7);

            // Build featured section (always show videos if available)
            if (featuredItems.length > 0) {
                let slidesHtml = '<div class="featured-slides">';
                
                featuredItems.forEach((item, index) => {
                    const isActive = index === 0 ? ' active' : '';
                    
                    slidesHtml += `<div class="featured-slide${isActive}">`;
                    slidesHtml += `<a href="${escapeHtml(item.url)}" target="_blank" class="featured-link">`;
                    slidesHtml += `<div class="featured-media-wrapper">`;
                    slidesHtml += `<iframe class="featured-video" src="${escapeHtml(item.video)}?autoplay=0&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                    
                    if (featuredItems.length > 1) {
                        slidesHtml += `
                            <button class="carousel-arrow carousel-arrow-prev" aria-label="Anterior">
                                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            </button>
                            <button class="carousel-arrow carousel-arrow-next" aria-label="Siguiente">
                                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                            </button>
                        `;
                    }
                    
                    slidesHtml += `</div>`;
                    slidesHtml += `
                        <div class="featured-content">
                            <span class="featured-category">${escapeHtml(item.category)}</span>
                            <h2 class="featured-title">${escapeHtml(item.title)}</h2>
                            <p class="featured-excerpt">${escapeHtml(item.excerpt)}</p>
                            <span class="featured-date">${escapeHtml(item.date)}</span>
                        </div>
                    </a>`;
                    slidesHtml += `</div>`;
                });
                
                slidesHtml += '</div>';
                document.getElementById('featuredNews').innerHTML = slidesHtml;
                
                // Start autoplay every 10 seconds
                if (featuredItems.length > 1) {
                    startCarousel(featuredItems.length);
                }
            } else {
                document.getElementById('featuredNews').innerHTML = '';
            }

            // News list - 7 items static (no ticker)
            const newsList = document.getElementById('newsList');
            newsList.innerHTML = remaining.slice(0, 7).map(item => `
                <a href="${escapeHtml(item.url)}" target="_blank" class="news-item">
                    <div class="news-content">
                        <span class="news-category">${escapeHtml(item.category)}</span>
                        <h3 class="news-title">${escapeHtml(item.title)}</h3>
                        <span class="news-date">${escapeHtml(item.date)}</span>
                    </div>
                </a>
            `).join('');
        }

        let carouselInterval = null;
        let currentSlide = 0;

        function startCarousel(totalSlides) {
            if (carouselInterval) {
                clearInterval(carouselInterval);
            }
            
            carouselInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                showSlide(currentSlide);
            }, 10000);
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.featured-slide');
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
        }

        // Handle arrow clicks
        document.addEventListener('click', (e) => {
            if (e.target.closest('.carousel-arrow-prev')) {
                e.preventDefault();
                e.stopPropagation();
                const totalSlides = document.querySelectorAll('.featured-slide').length;
                currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                showSlide(currentSlide);
                startCarousel(totalSlides);
            }
            
            if (e.target.closest('.carousel-arrow-next')) {
                e.preventDefault();
                e.stopPropagation();
                const totalSlides = document.querySelectorAll('.featured-slide').length;
                currentSlide = (currentSlide + 1) % totalSlides;
                showSlide(currentSlide);
                startCarousel(totalSlides);
            }
        });

        // Equalize heights - responsive
        function equalizeHeights() {
            const featured = document.querySelector('.featured-section');
            const newsList = document.querySelector('.news-list-section');
            if (featured && newsList) {
                if (window.innerWidth >= 768) {
                    // Desktop: equal heights
                    newsList.style.height = featured.offsetHeight + 'px';
                    newsList.style.maxHeight = featured.offsetHeight + 'px';
                } else {
                    // Mobile: auto height
                    newsList.style.height = 'auto';
                    newsList.style.maxHeight = 'none';
                }
            }
        }

        // Observer for dynamic content
        const observer = new MutationObserver(() => {
            equalizeHeights();
        });

        // Initial load
        loadNews();

        // Equalize after content loads and on resize
        requestAnimationFrame(() => {
            setTimeout(() => {
                equalizeHeights();
                observer.observe(document.querySelector('.main-layout'), { childList: true, subtree: true });
            }, 100);
        });
        window.addEventListener('resize', equalizeHeights);
    </script>
